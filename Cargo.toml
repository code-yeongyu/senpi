[workspace]
members = ["crates/senpi-pty", "crates/senpi-grep"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
napi = "=3.12.1"
napi-derive = "=3.6.3"
napi-build = "=2.4.1"
portable-pty = "=0.9.0"
ignore = "=0.4.33"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
regex-syntax = "=0.8.11"
grep-matcher = "=0.1.9"
globset = "=0.4.20"
rayon = "=1.12.0"
memchr = "=2.8.3"

[workspace]
members = [
    "crates/senpi-pty",
    "crates/senpi-grep",
    "crates/senpi-socket-secret",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
napi = "=3.16.2"
napi-derive = "=3.7.1"
napi-build = "=2.6.0"
portable-pty = "=0.9.0"
ignore = "=0.4.34"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
regex-syntax = "=0.8.12"
grep-matcher = "=0.1.9"
globset = "=0.4.21"
rayon = "=1.12.0"
memchr = "=2.8.3"


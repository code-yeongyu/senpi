packages:
  - "packages/*"
  - "packages/coding-agent/examples/extensions/with-deps"
  - "packages/coding-agent/examples/extensions/custom-provider-anthropic"
  - "packages/coding-agent/examples/extensions/custom-provider-gitlab-duo"
  - "packages/coding-agent/examples/extensions/custom-provider-qwen-cli"

nodeLinker: hoisted
linkWorkspacePackages: deep
preferWorkspacePackages: true
blockExoticSubdeps: false

onlyBuiltDependencies:
  - "@google/genai"
  - "@parcel/watcher"
  - canvas
  - esbuild
  - protobufjs

allowBuilds:
  '@google/genai': set this to true or false
  '@parcel/watcher': set this to true or false
  canvas: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false

minimumReleaseAgeExclude:
  - '@aws-sdk/client-bedrock-runtime@3.1097.0'
  - '@aws-sdk/core@3.977.2'
  - '@aws-sdk/credential-provider-env@3.972.63'
  - '@aws-sdk/credential-provider-http@3.972.65'
  - '@aws-sdk/credential-provider-ini@3.973.8'
  - '@aws-sdk/credential-provider-login@3.972.70'
  - '@aws-sdk/credential-provider-node@3.972.74'
  - '@aws-sdk/credential-provider-process@3.972.63'
  - '@aws-sdk/credential-provider-sso@3.973.7'
  - '@aws-sdk/credential-provider-web-identity@3.972.69'
  - '@aws-sdk/middleware-websocket@3.972.45'
  - '@aws-sdk/nested-clients@3.997.37'
  - '@aws-sdk/token-providers@3.1097.0'
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - jsdom@30.0.1
  - openai@7.1.0
  - pdfjs-dist@6.2.108

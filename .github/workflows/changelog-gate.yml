name: Changelog gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue requires every required check on the commit it is about to merge. The per-PR
  # changelog check needs the pull request's base, head and labels, which a merge_group event does
  # not carry, and it already passed on the PR; on the queue commit this job runs the whole-tree
  # changes.md audit, which needs no PR metadata and still catches a queue-time merge that breaks
  # tracker coverage.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: changelog-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # User-facing PRs must ship a CHANGELOG [Unreleased] entry (or carry the
  # `no-changelog` label) and cover every upstream-owned production change in
  # its exact nearest changes.md tracker with all four canonical sections.
  changelog-gate:
    name: Changelog gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Audit only this PR; refs/pull/*/merge may include newer main commits
          # than the event's base.sha and falsely attribute their changes here.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check PR changelog and changes.md coverage
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-pr-changelog.mjs

      # Audit the whole tree against the pinned upstream: every upstream-owned
      # production path must be covered by its exact nearest changes.md tracker.
      # Catches a newly added nearest tracker shadowing a parent's coverage
      # (senpi#2895 -> senpi#3006), which the per-PR gate above cannot see.
      # Needs the full history already fetched above; fails with rc 1 when any
      # path is uncovered, no changelog label required.
      - name: Audit changes.md coverage against the upstream pin
        run: node scripts/audit-changes-md.mjs

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Changelog gate"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

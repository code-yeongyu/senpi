name: Changelog gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # User-facing PRs must ship a CHANGELOG [Unreleased] entry (or carry the
  # `no-changelog` label) and cover every upstream-owned production change in
  # its exact nearest changes.md tracker with all four canonical sections.
  changelog-gate:
    name: Changelog gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Check PR changelog and changes.md coverage
        env:
          CHANGELOG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGELOG_GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-pr-changelog.mjs

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Changelog gate"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

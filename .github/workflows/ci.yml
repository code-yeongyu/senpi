name: CI

on:
  push:
    branches: [main]
  # Every pull request runs CI, whatever its base: a PR stacked on another feature branch must not reach main untested
  # (senpi#2759).
  pull_request:
  # ci-full-label.yml calls this workflow when a PR gets the run-full-ci label (senpi#3957).
  workflow_call:

# A pull request has one run group (its ref is refs/pull/<n>/merge): a push or restack cancels the run it
# supersedes. A main push gets its own group per commit, so its run never waits behind another main run and is
# never cancelled or replaced by a later merge: every main commit ends with its own "Check and test" result, which
# the release reuses as its test evidence (senpi#2960). After the fixed per-file prefix comes the workflow name, which is
# the caller's when ci-full-label.yml calls this workflow, so a label-forced full run never cancels the PR's own run, and
# the label run's other called workflows (their own prefixes) never cancel this one (senpi#3957).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SENPI_TEST_TEMP_GUARD: "1"

jobs:
  # Hosted macOS and Windows runners are scarce, so a pull request runs the jobs that need one only when its diff
  # touches platform-specific paths (scripts/ci-platform-scope.mjs, senpi#3957). A push to main and the run-full-ci
  # label (ci-full-label.yml) always run the full set.
  platform-scope:
    name: Platform scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci-platform-scope.mjs
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: List the pull request's changed files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files"; then
            echo "CHANGED_FILES=$RUNNER_TEMP/changed-files" >> "$GITHUB_ENV"
          else
            echo "::warning::could not list the changed files; running the full macOS/Windows set"
          fi

      - name: Classify
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-platform-scope.mjs classify --event "$EVENT_NAME" --labels "$PR_LABELS" --changed "${CHANGED_FILES:-}" --workflow .github/workflows/ci.yml

  codemode-gate:
    name: codemode-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reviews baseline.json changes against the pull request's merge base, so it needs history.
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
      - name: Setup Julia
        uses: julia-actions/setup-julia@e89cce584bf1958661244c90fdf08fea80dadbd1 # v3.0.2 + 16 commits (includes upstream #416)
        with:
          version: "1.12"
      - name: Install Ruby prelude dependency
        run: gem install base64 --version 0.3.0 --no-document
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build workspace entries
        run: bun packages/senpi-codemode/scripts/gate-build.ts
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Eval regression gate
        run: node scripts/run-tests.mjs bun run --cwd packages/senpi-codemode gate --baseline test/gate/baseline.json
      - name: Codemode package tests (including gate regressions)
        run: bun run --cwd packages/senpi-codemode test -- test/gate
      - name: Gate harness types
        run: bunx tsc --noEmit --project packages/senpi-codemode/scripts/tsconfig.gate.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codemode-gate-report
          path: packages/senpi-codemode/gate-report.json
          if-no-files-found: error
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          bash scripts/install-ci-system-deps.sh \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # check:bun-lock resolves bun.lock in an isolated island and fails when a fresh `bun install` would rewrite it (senpi#2352).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Check
        env:
          # Public ubuntu-latest has 16 GB RAM: cap each sequential tsc heap at 10 GiB (62.5%),
          # leaving 6 GiB for the OS, runner, and native allocations (senpi#4022).
          NODE_OPTIONS: --max-old-space-size=10240
        run: npm run check

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Real CLI text-tool recovery self-test
        timeout-minutes: 5
        run: node scripts/run-tests.mjs node .agents/skills/senpi-qa/scripts/mock-loop.mjs --self-test --api anthropic-messages

      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json

      - name: Build workspace package entries
        run: npm run build

      # The publish workflow's release step refuses a dirty tree after `npm run build`, so a committed
      # dist file that the build rewrites (the bin stubs kept by .gitignore) must match the build output.
      - name: Committed dist files match the build
        run: git diff --exit-code -- ':(glob)packages/*/dist/**'

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Static checks"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The coding-agent vitest suite dominates CI wall time (2467+ files; three
  # shards reached 27-minute jobs). Sharding it across four
  # runners divides that wall while each shard keeps the CI fork-pool settings
  # from vitest.config.ts (forks pool, capped workers) that prevent the historical
  # subprocess-suite pool hang.
  test-coding-agent:
    name: Test (coding-agent ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          bash scripts/install-ci-system-deps.sh \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Test shard
        timeout-minutes: 25
        run: node ../../scripts/run-tests.mjs vitest run --shard=${{ matrix.shard }}/4
        working-directory: packages/coding-agent

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test (coding-agent ${{ matrix.shard }}/4)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  grep-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install system dependencies
        timeout-minutes: 5
        run: bash scripts/install-ci-system-deps.sh ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      - name: Setup Rust
        run: |
          toolchain=stable
          if [ -f rust-toolchain.toml ]; then
            toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build native grep crate
        run: cargo build -p senpi-grep --release --locked

      - name: Build native grep addon
        run: npm exec --yes --package @napi-rs/cli@3.7.2 -- napi build --platform --release -- --locked
        working-directory: crates/senpi-grep

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Test grep with both engines
        run: |
          node_file=$(ls crates/senpi-grep/senpi_grep.*.node)
          export SENPI_GREP_NATIVE_PATH="$PWD/$node_file"
          cd packages/coding-agent
          echo "engine=native"
          SENPI_GREP_ENGINE=native node ../../scripts/run-tests.mjs vitest run test/grep --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/grep-native-contract.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/grep-native-contract.json`, "utf8"));
          const contract = report.testResults.find((file) => file.name.endsWith("/engine-contract.native.test.ts"));
          assert.ok(contract?.assertionResults.length > 1, "native contract cases must run");
          assert.ok(contract.assertionResults.every((test) => test.status === "passed"));
          console.log(`engine=native engine-contract.native.test.ts: ${contract.assertionResults.length} passed, 0 skipped`);
          NODE
          echo "engine=rg"
          SENPI_GREP_ENGINE=rg node ../../scripts/run-tests.mjs vitest run test/grep
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  hooks-trust-storage-windows:
    name: Hooks trust storage (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run hooks trust-storage regressions
        run: node ../../scripts/run-tests.mjs vitest run test/suite/hooks-trust.test.ts test/suite/hooks-trust-storage-errors.test.ts test/suite/hooks-trust-storage-release-errors.test.ts test/suite/hooks-trust-storage-aba.test.ts
        working-directory: packages/coding-agent
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  # senpi#3604: main-screen mouse tracking is gated on WT_SESSION on win32, and the ask-user hint
  # names Windows Terminal's Shift selection bypass. Run the wheel-yield and hint tests on Windows.
  tui-mouse-windows:
    name: TUI mouse wheel and hint (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run main-screen mouse tests
        run: node ../../scripts/run-tests.mjs node --test --import tsx --import ./test/setup-multiplexer-env.mjs test/tui-main-screen-mouse.test.ts
        working-directory: packages/tui

      - name: Run ask-user widget mouse tests
        run: node ../../scripts/run-tests.mjs vitest run test/suite/ask-user-widget-mouse.test.ts
        working-directory: packages/coding-agent

      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json

  # Durable scheduled prompts: rename claims, runner leases, ungated delivery locks, taskkill
  # timeouts and cmd.exe `--exec` hooks all behave differently on Windows.
  # senpi#3566 todo 4 (Windows half): the tool child's Job Object containment against the real kernel32. These tests need
  # bun:ffi, so vitest runs under Bun here; under Node they skip themselves, which the last step refuses.
  tool-child-windows:
    name: Tool child Job Object (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run tool child Windows tests under Bun
        shell: bash
        run: node ../../scripts/run-tests.mjs bun --bun ../../node_modules/vitest/vitest.mjs run src/modes/rpc/tool-child/windows-job.win32.test.ts src/modes/rpc/tool-child/launch-barrier.win32.test.ts src/modes/rpc/tool-child/child-containment.test.ts src/modes/rpc/tool-child/windows-breakaway.test.ts src/modes/rpc/tool-child/windows-command-line.test.ts --reporter=verbose --reporter=json --outputFile=vitest-tool-child-win32.json
        working-directory: packages/coding-agent

      # A skipped suite exits 0: fail unless both real-kernel files executed and every test in them passed.
      - name: Require the real-kernel tests to have executed
        shell: bash
        run: |
          for name in windows-job.win32.test.ts launch-barrier.win32.test.ts; do
            node -e '
              const r = JSON.parse(require("fs").readFileSync("vitest-tool-child-win32.json", "utf8"));
              const file = r.testResults.find((t) => t.name.split("\\").join("/").endsWith(process.argv[1]));
              const passed = file ? file.assertionResults.filter((a) => a.status === "passed").length : 0;
              const other = file ? file.assertionResults.filter((a) => a.status !== "passed").length : 0;
              console.log(process.argv[1] + " passed=" + passed + " other=" + other);
              if (passed === 0 || other !== 0) process.exit(1);
            ' "$name"
          done
        working-directory: packages/coding-agent

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tool child Job Object (Windows)"
            if [ -f vitest-tool-child-win32.json ]; then
              node -e 'const r = JSON.parse(require("fs").readFileSync("vitest-tool-child-win32.json", "utf8")); console.log("- tests: " + r.numPassedTests + " passed, " + r.numFailedTests + " failed, " + r.numPendingTests + " skipped");'
            else
              echo "- no test report was written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/coding-agent

      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json
  schedule-windows:
    name: Scheduled prompts (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # schedule-cli spawns the source CLI, which resolves workspace packages through their dist.
      - name: Build workspace package entries
        run: npm run build

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run scheduled-prompt suites
        run: node ../../scripts/run-tests.mjs vitest run test/suite/schedule-runner.test.ts test/suite/schedule-extension.test.ts test/suite/schedule-cli.test.ts
        working-directory: packages/coding-agent
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  rpc-windows:
    name: RPC named pipes (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      # Each suite runs in its own process; lifecycle failures are not retried in-process. The verbose
      # reporter names every test in the log, so a Windows-only case is provably run, not just counted.
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run RPC host ensure tests
        run: node ../../scripts/run-tests.mjs vitest run test/rpc-host-ensure.test.ts --reporter=verbose
        working-directory: packages/coding-agent

      - name: Run RPC host lifecycle tests
        run: node ../../scripts/run-tests.mjs vitest run test/rpc-host-lifecycle.test.ts --reporter=verbose
        working-directory: packages/coding-agent

      - name: Run RPC socket transport tests
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/rpc-socket-transport.test.ts --reporter=verbose --reporter=json --outputFile=vitest-socket-transport.json
        working-directory: packages/coding-agent

      # The `senpi host` contract over the named-pipe transport: a second ensure reuses the daemon
      # on the pipe, and a generation handoff refuses (a pipe can be neither renamed nor drained).
      - name: Run senpi host CLI tests (named pipes)
        run: node ../../scripts/run-tests.mjs vitest run test/suite/host-cli-win32.test.ts --reporter=verbose
        working-directory: packages/coding-agent

      - name: Run shared process identity tests
        run: node ../../scripts/run-tests.mjs vitest run test/suite/process-identity.test.ts --reporter=verbose
        working-directory: packages/coding-agent

      # endpoint.json written and read back on Windows paths: registry_version, endpoint_kind, and a
      # legacy record read as rpc_host.
      - name: Run endpoint registry tests
        run: node ../../scripts/run-tests.mjs vitest run test/suite/rpc-endpoint-registry.test.ts --reporter=verbose
        working-directory: packages/coding-agent

      # An interactive TUI on win32 registers its control endpoint over a named pipe: host status --all
      # lists it as a live tui endpoint, and a client attaches and drives it (senpi#4267).
      - name: Run interactive TUI control endpoint tests (win32)
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/suite/interactive-session-control-win32.test.ts src/modes/rpc/tui-socket.observer.test.ts --reporter=verbose --reporter=json --outputFile=vitest-tui-control-win32.json
        working-directory: packages/coding-agent

      # A skipped suite exits 0: fail unless the win32-only cases (the named-pipe wrong-secret test and
      # the TUI pipe-endpoint suite) executed and every test in those files passed.
      - name: Require the win32 gateway parity tests to have executed
        shell: bash
        run: |
          for pair in vitest-socket-transport.json:rpc-socket-transport.test.ts vitest-tui-control-win32.json:interactive-session-control-win32.test.ts; do
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const file = r.testResults.find((t) => t.name.replace(/\\/g, "/").endsWith(process.argv[2]));
              const passed = file ? file.assertionResults.filter((a) => a.status === "passed").length : 0;
              const other = file ? file.assertionResults.filter((a) => a.status !== "passed").length : 0;
              console.log(process.argv[1] + ": " + process.argv[2] + " passed=" + passed + " other=" + other);
              if (passed === 0 || other !== 0) process.exit(1);
            ' "${pair%%:*}" "${pair#*:}"
          done
        working-directory: packages/coding-agent
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  compiled-extensions-windows:
    name: Compiled extensions (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install archive tool
        shell: pwsh
        run: |
          # Chocolatey can report "installed 0/0 packages" and exit 0 when its feed is down (#3088),
          # so retry a few times and fail this step unless zip is actually on PATH.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install zip --no-progress -y
            if (Get-Command zip -ErrorAction SilentlyContinue) { break }
            if ($attempt -lt 4) {
              Write-Host "zip not installed (attempt $attempt); retrying in $($attempt * 15)s"
              Start-Sleep -Seconds ($attempt * 15)
            }
          }
          $zip = Get-Command zip -ErrorAction SilentlyContinue
          if (-not $zip) {
            Write-Error "zip is not on PATH after 4 Chocolatey attempts; the Chocolatey community feed is likely unavailable."
            exit 1
          }
          Write-Host "zip: $($zip.Source)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Verify native importer
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/extensions/bun-extension-importer.test.ts test/extensions/bun-extension-regressions.test.ts
        working-directory: packages/coding-agent

      - name: Verify relocated compiled extensions
        shell: bash
        run: node scripts/run-tests.mjs bun test scripts/compiled-extension-platform.test.ts scripts/compiled-extension-load.test.ts
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  # omo#8700: npm installs Claude Code on Windows as a claude.cmd shim around bin\claude.exe. The
  # shim-resolution test only runs on a real Windows host, under Node and under Bun (the omo engine
  # runtime); the JSON check fails the job if that file was skipped instead of executed.
  claude-executable-windows:
    name: Claude Code executable (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run Claude executable resolution tests (Node)
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/anthropic-subscription-executable-path-lookup.test.ts test/anthropic-subscription-executable-windows.test.ts --reporter=default --reporter=json --outputFile=vitest-node.json
        working-directory: packages/coding-agent

      - name: Run Claude executable shim test (Bun)
        shell: bash
        run: bun ../../scripts/run-tests.mjs vitest run test/anthropic-subscription-executable-windows.test.ts --reporter=default --reporter=json --outputFile=vitest-bun.json
        working-directory: packages/coding-agent

      - name: Require the Windows shim test to have executed
        shell: bash
        run: |
          for report in vitest-node.json vitest-bun.json; do
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const file = r.testResults.find((t) => t.name.replace(/\\/g, "/").endsWith("anthropic-subscription-executable-windows.test.ts"));
              const passed = file ? file.assertionResults.filter((a) => a.status === "passed").length : 0;
              const other = file ? file.assertionResults.filter((a) => a.status !== "passed").length : 0;
              console.log(process.argv[1] + ": windows shim test passed=" + passed + " other=" + other);
              if (passed === 0 || other !== 0) process.exit(1);
            ' "$report"
          done
        working-directory: packages/coding-agent
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  # omo#7691: a bash-tool command whose node starts its own child must not open a visible console when senpi
  # runs without one. The probe detaches its own console (an IDE/GUI-launched host), so only a Windows runner
  # can measure it; the JSON check fails the job if the suite was skipped instead of run.
  bash-grandchild-console-windows:
    name: Bash grandchild consoles (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run the bash grandchild console probe
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/bash-grandchild-console-windows.test.ts --reporter=verbose --reporter=json --outputFile=vitest-console.json
        working-directory: packages/coding-agent
        env:
          SENPI_CONSOLE_PROBE_RESULTS: console-probe-results.jsonl

      - name: Require the console probe to have executed
        if: always()
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-console.json", "utf8"));
            const file = r.testResults.find((t) => t.name.replace(/\\/g, "/").endsWith("bash-grandchild-console-windows.test.ts"));
            const ran = file ? file.assertionResults.filter((a) => a.status === "passed" || a.status === "failed").length : 0;
            console.log("bash grandchild console probe cases run=" + ran);
            if (ran !== 12) process.exit(1);
          '
          echo "--- raw console probe results ---"
          cat console-probe-results.jsonl || echo "(no results file)"
        working-directory: packages/coding-agent
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  # senpi#2248: Bun builds Chrome-backed WebViews only on the process main thread, so eval cells
  # reach them through the main-thread service. The suites need Bun and a real Chrome (preinstalled
  # on hosted runners) and are skipped elsewhere; the JSON check fails the job if they were skipped.
  webview-kernel:
    name: Eval kernel WebView (${{ matrix.os }})
    needs: platform-scope
    strategy:
      fail-fast: false
      matrix:
        # Windows only for a full run (senpi#3957); Linux always.
        os: ${{ fromJSON(needs.platform-scope.outputs.full == 'true' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # senpi#2353: a hung suite must not run into the job timeout: GitHub discards a cancelled job's
      # log, and a runner that stops answering never enforces a step timeout either. The step watches
      # the suite itself and, after 9 minutes (a normal Windows run takes about 3), prints what it has,
      # the processes still running, and the readiness log, then fails.
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run eval kernel WebView suites (Bun)
        shell: bash
        timeout-minutes: 12
        env:
          SENPI_WEBVIEW_READINESS_LOG: ${{ runner.temp }}/webview-readiness.log
        run: |
          out="$RUNNER_TEMP/vitest-webview.txt"
          bun ../../scripts/run-tests.mjs vitest run test/js-kernel-webview.test.ts test/js-kernel-webview-lifecycle.test.ts test/js-kernel-webview-resilience.test.ts test/js-kernel-webview-launch.test.ts test/js-kernel-webview-readiness.test.ts --reporter=verbose --reporter=hanging-process --reporter=json --outputFile=vitest-webview.json > "$out" 2>&1 &
          suite=$!
          for _ in $(seq 1 540); do kill -0 "$suite" 2>/dev/null || break; sleep 1; done
          if kill -0 "$suite" 2>/dev/null; then
            cat "$out"
            echo "::error::WebView suites still running after 9 minutes; the last finished test is above"
            if command -v tasklist >/dev/null; then tasklist //FO CSV | grep -iE 'chrome|bun|node|powershell|tasklist|taskkill' || true; else ps -axo pid,ppid,etime,command | grep -iE 'chrom|bun|node' || true; fi
            cat "$SENPI_WEBVIEW_READINESS_LOG" 2>/dev/null || true
            kill "$suite" 2>/dev/null || true
            exit 1
          fi
          status=0
          wait "$suite" || status=$?
          cat "$out"
          exit "$status"
        working-directory: packages/senpi-codemode

      # senpi#2353: one line per Chrome launch (time to attach, or the stalled phase and the retirement).
      - name: Show the WebView readiness log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/webview-readiness.log" 2>/dev/null || echo "no readiness log"

      - name: Require the WebView suites to have executed
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-webview.json", "utf8"));
            const results = r.testResults.flatMap((file) => file.assertionResults);
            const passed = results.filter((a) => a.status === "passed").length;
            const failed = results.filter((a) => a.status === "failed").length;
            const skipped = results.filter((a) => a.status !== "passed" && a.status !== "failed").length;
            const allowedSkips = process.platform === "win32" ? 1 : 0;
            console.log("webview suites: passed=" + passed + " failed=" + failed + " skipped=" + skipped);
            if (passed < 10 || failed !== 0 || skipped > allowedSkips) process.exit(1);
          '
        working-directory: packages/senpi-codemode
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  process-kernel:
    name: Eval kernel process isolation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # How this runner handles a crashing process: a piped core-dump handler keeps a crashed kernel child alive
      # until its dump is consumed, which the SIGSEGV case waits on.
      - name: Show the crash-handling environment
        shell: bash
        run: |
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || sysctl -n kern.corefile 2>/dev/null || echo n/a)"
          echo "ulimit -c: $(ulimit -c)"
          ( bun -e 'process.kill(process.pid, "SIGSEGV")' >/dev/null 2>&1; echo "bun SIGSEGV exit status: $?" ) &
          start=$(date +%s); wait; echo "bun SIGSEGV took $(( $(date +%s) - start ))s to exit"

      # Process mode spawns its kernel child with bun on both platforms; a platform where the child cannot start
      # (senpi#2706: a Linux spawn's stdout is a socket) fails here instead of shipping.
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Run the process-mode kernel suite
        timeout-minutes: 12
        run: node ../../scripts/run-tests.mjs vitest run test/js-process-kernel.test.ts --reporter=verbose --reporter=json --outputFile=vitest-process.json
        working-directory: packages/senpi-codemode

      # Runs whatever the suite's outcome: a failed run is when a kernel child is most likely to leak.
      - name: Fail on any orphaned kernel child
        if: always()
        shell: bash
        run: |
          orphans=$(ps -eo pid,ppid,command | grep '[p]rocess-entry.js' | awk '$2 == 1' || true)
          if [ -n "$orphans" ]; then echo "$orphans"; echo "::error::kernel children outlived the suite"; exit 1; fi

      - name: Require the process-mode suite to have executed
        if: always()
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-process.json", "utf8"));
            const results = r.testResults.flatMap((file) => file.assertionResults);
            const passed = results.filter((a) => a.status === "passed").length;
            const failed = results.filter((a) => a.status === "failed").length;
            const skipped = results.filter((a) => a.status !== "passed" && a.status !== "failed");
            // A skip is allowed only for a Linux-only case off Linux (named, so a newly skipped test still fails here).
            const linuxOnly = /When a Linux kernel child|SENPI_KERNEL_CORE_DUMPS=1|parent is a subreaper/;
            const unexpected = skipped.filter((a) => process.platform === "linux" || !linuxOnly.test(a.title));
            console.log("process-mode suite: passed=" + passed + " failed=" + failed + " skipped=" + skipped.length);
            for (const a of unexpected) console.log("unexpected skip: " + a.title);
            if (passed < 30 || failed !== 0 || unexpected.length !== 0) process.exit(1);
          '
        working-directory: packages/senpi-codemode
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  python-kernel-windows:
    name: Python kernel cold startup (Windows)
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: bun scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Slow and hung bootstrap regressions
        working-directory: packages/senpi-codemode
        run: bun ../../scripts/run-tests.mjs vitest run test/py-kernel-startup.test.ts test/py-kernel.test.ts test/py-kernel-child-error.test.ts
      - name: Python environments stay inside the revision on Windows
        working-directory: packages/senpi-codemode
        shell: pwsh
        run: |
          bun ../../scripts/run-tests.mjs vitest run test/environments/py-environment.test.ts -t "pip config file|staged revision|null device" --reporter=default --reporter=json --outputFile="$env:RUNNER_TEMP/py-env-win.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A skipped test is not a pass: the pip-config case must have run on this Windows interpreter.
          bun -e "const r = JSON.parse(await Bun.file(process.argv[1]).text()); const t = r.testResults.flatMap((f) => f.assertionResults).find((a) => a.title.startsWith('When a pip config file names a root')); const d = r.testResults.flatMap((f) => f.assertionResults).find((a) => a.title.includes('pointed at the null device')); if (!t || t.status !== 'passed' || !d || d.status !== 'passed') { console.error('pip config test: ' + (t ? t.status : 'missing') + ', null device test: ' + (d ? d.status : 'missing')); process.exit(1) }" "$env:RUNNER_TEMP/py-env-win.json"
      # Plan node 11: Python kernel tools serve callbacks on threads beside a SIGTERM-only interrupt; run them on Windows too.
      - name: Kernel-tool suites
        working-directory: packages/senpi-codemode
        run: python --version && bun ../../scripts/run-tests.mjs vitest run test/py-kernel-tools.test.ts test/kernel-tools-registry.test.ts test/kernel-tools-reentrancy.test.ts --reporter=default --reporter=json --outputFile.json=vitest-kernel-tools.json
      - name: Require the kernel-tool suites to have executed
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-kernel-tools.json", "utf8"));
            const results = r.testResults.flatMap((file) => file.assertionResults);
            const python = r.testResults.filter((file) => file.name.endsWith("py-kernel-tools.test.ts")).flatMap((file) => file.assertionResults);
            const passed = results.filter((a) => a.status === "passed").length;
            const failed = results.filter((a) => a.status === "failed").length;
            const skipped = results.length - passed - failed;
            console.log("kernel-tool suites: passed=" + passed + " failed=" + failed + " skipped=" + skipped + " python=" + python.length);
            if (failed !== 0 || skipped !== 0 || python.length < 15 || python.some((a) => a.status !== "passed")) process.exit(1);
            const forward = python.find((a) => a.title.startsWith("a cell compiles a bare forward annotation"));
            if (!forward || forward.status !== "passed") { console.error("bare forward annotation test: " + (forward ? forward.status : "missing")); process.exit(1); }
          '
        working-directory: packages/senpi-codemode
      - name: Build isolated packaged Python host
        shell: pwsh
        run: |
          $hostRoot = "$env:RUNNER_TEMP/python-host"
          New-Item -ItemType Directory -Force $hostRoot | Out-Null
          bun build --compile --target bun-windows-x64 packages/senpi-codemode/scripts/qa-python-startup.ts --outfile "$hostRoot/python-host.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sidecar = "$hostRoot/node_modules/@code-yeongyu/senpi-codemode/src/kernels/py"
          New-Item -ItemType Directory -Force $sidecar | Out-Null
          Copy-Item packages/senpi-codemode/src/kernels/py/prelude.py "$sidecar/prelude.py"
      - name: Packaged cold and warm Python cells
        shell: pwsh
        run: |
          bun scripts/run-tests.mjs "$env:RUNNER_TEMP/python-host/python-host.exe"
          exit $LASTEXITCODE
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: bun scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  test-workspaces:
    name: Test (workspaces + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          bash scripts/install-ci-system-deps.sh \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Codemode's graph suite rebuilds workspace entries and compile assets itself.
      # Keep both graph checks ahead of script tests, which can invalidate dist.
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Fresh release entry graphs (codemode and exclusions)
        run: |
          npm rebuild canvas --foreground-scripts
          node scripts/run-tests.mjs bun test scripts/release-graph-codemode.test.ts
          node scripts/run-tests.mjs bun test scripts/release-graph-exclusions.test.ts

      - name: Node bundle isolation and RPC smoke
        run: |
          node scripts/run-tests.mjs bun test scripts/node-bundle-provider-isolation.test.ts
          node scripts/run-tests.mjs bun test scripts/node-bundle-smoke.test.ts
          node scripts/run-tests.mjs bun test scripts/node-bundle-cursor-exec.test.ts
          node scripts/run-tests.mjs bun test scripts/node-bundle-reinstall.test.ts
          node scripts/run-tests.mjs bun test scripts/bun-bundle-provider-coverage.test.ts
          node scripts/run-tests.mjs bun test scripts/compiled-provider-probe.test.ts

      # The native grep probe tests load the senpi-grep addon. Build it once here, with the Rust
      # cache, and hand its path to both script-test steps; the test refuses to build it inside a
      # hook in CI (#3978).
      - name: Setup Rust
        run: |
          toolchain=stable
          if [ -f rust-toolchain.toml ]; then
            toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build native grep addon
        working-directory: crates/senpi-grep
        run: |
          npm exec --yes --package @napi-rs/cli@3.7.2 -- napi build --platform --release -- --locked
          node_file=$(ls senpi_grep.*.node)
          echo "SENPI_GREP_NATIVE_PATH=$PWD/$node_file" >> "$GITHUB_ENV"

      - name: Script tests
        run: npm run test:scripts

      # The same script tests launched by bun: scripts/run-workspaces.test.mjs drives the
      # workspace runner with whichever package manager started the run, so this step is
      # the CI proof that root `bun run <script>` fans out through bun, not npm.
      - name: Script tests (bun)
        run: bun run test:scripts

      # The workspace runner is the same code path root `npm run test` / `bun run test` use.
      - name: Workspace tests (all but coding-agent)
        timeout-minutes: 25
        run: >
          node scripts/run-workspaces.mjs
          --if-present
          --workspace packages/agent
          --workspace packages/ai
          --workspace packages/pty
          --workspace packages/senpi-codemode
          --workspace packages/server
          --workspace packages/tui
          test

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test (workspaces + scripts)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  rpc-owner-lifetime:
    name: RPC supervisor exit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Require the POSIX exit-event compiler
        shell: bash
        run: |
          command -v cc >/dev/null || { echo "::error::Missing C compiler 'cc' on PATH for POSIX process-exit tests"; exit 1; }
          cc --version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspace package entries
        run: npm run build
      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Supervisor owner, normal-stop and compiler regressions
        working-directory: packages/coding-agent
        run: >
          node ../../scripts/run-tests.mjs vitest run
          test/suite/regressions/3044-rpc-owner-lifetime.test.ts
          test/suite/regressions/3045-owner-review.test.ts
          test/suite/regressions/3054-supervisor-child-exit.test.ts
          test/suite/regressions/3054-process-exit-compiler.test.ts
          test/suite/regressions/3054-legacy-drain-deadline.test.ts
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json


  # Fan-in gate carrying the exact context name branch protection requires
  # ("Check and test"). It succeeds only when every check/test job above passed,
  # so the required-status contract is unchanged while the work runs in parallel.
  check-and-test:
    name: Check and test
    needs:
      [
        platform-scope,
        check,
        codemode-gate,
        test-coding-agent,
        rpc-owner-lifetime,
        macos-combined,
        grep-native-contract,
        hooks-trust-storage-windows,
        tui-mouse-windows,
        schedule-windows,
        rpc-windows,
        tool-child-windows,
        compiled-extensions-windows,
        claude-executable-windows,
        webview-kernel,
        python-kernel-windows,
        bash-grandchild-console-windows,
        test-workspaces,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the gate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-platform-scope.mjs
          sparse-checkout-cone-mode: false

      # Every job must succeed; a macOS/Windows-only job may be skipped only when platform-scope decided this run
      # is not full (senpi#3957). A failed or missing scope decision allows no skips.
      - name: Verify all gates
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-platform-scope.mjs verify --full "${{ needs.platform-scope.outputs.full }}"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Check and test (fan-in)"
            echo "- platform-scope: ${{ needs.platform-scope.result }} (full=${{ needs.platform-scope.outputs.full }})"
            echo "- check: ${{ needs.check.result }}"
            echo "- codemode-gate: ${{ needs.codemode-gate.result }}"
            echo "- test-coding-agent: ${{ needs.test-coding-agent.result }}"
            echo "- rpc-owner-lifetime: ${{ needs.rpc-owner-lifetime.result }}"
            echo "- macos-combined: ${{ needs.macos-combined.result }}"
            echo "- grep-native-contract: ${{ needs.grep-native-contract.result }}"
            echo "- hooks-trust-storage-windows: ${{ needs.hooks-trust-storage-windows.result }}"
            echo "- schedule-windows: ${{ needs.schedule-windows.result }}"
            echo "- rpc-windows: ${{ needs.rpc-windows.result }}"
            echo "- compiled-extensions-windows: ${{ needs.compiled-extensions-windows.result }}"
            echo "- claude-executable-windows: ${{ needs.claude-executable-windows.result }}"
            echo "- webview-kernel: ${{ needs.webview-kernel.result }}"
            echo "- python-kernel-windows: ${{ needs.python-kernel-windows.result }}"
            echo "- bash-grandchild-console-windows: ${{ needs.bash-grandchild-console-windows.result }}"
            echo "- test-workspaces: ${{ needs.test-workspaces.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # One runner per head, with an independent temp owner for each former macOS leg (#3130).
  # WebView runs last: its SIGSTOP/SIGKILL Chrome tests can wedge hosted macOS runners (#2290).
  macos-combined:
    name: macOS combined
    needs: platform-scope
    if: needs.platform-scope.outputs.full == 'true'
    runs-on: macos-latest
    # Each suite step keeps the cap it had on its old leg: its own step timeout where it had one
    # (process and WebView: 12), else its old job cap (the terminal part's two steps share its 30).
    # The job cap is the sum of those step caps plus 10 minutes of shared setup, so one hung suite
    # holds the macOS runner only for its own budget and the later suites still run.
    timeout-minutes: 99
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies and build workspace entries
        id: install
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Show the crash-handling environment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || sysctl -n kern.corefile 2>/dev/null || echo n/a)"
          echo "ulimit -c: $(ulimit -c)"
          ( bun -e 'process.kill(process.pid, "SIGSEGV")' >/dev/null 2>&1; echo "bun SIGSEGV exit status: $?" ) &
          start=$(date +%s); wait; echo "bun SIGSEGV took $(( $(date +%s) - start ))s to exit"

      # Process mode spawns its kernel child with bun on both platforms; a platform where the child cannot start
      # (senpi#2706: a Linux spawn's stdout is a socket) fails here instead of shipping.

      - name: Snapshot OS temp before tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: process_test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/process-test-temp-before.json --export-env

      - name: Run the process-mode kernel suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.process_test_temp_snapshot.outcome == 'success' }}
        id: process
        timeout-minutes: 12
        run: node ../../scripts/run-tests.mjs vitest run test/js-process-kernel.test.ts --reporter=verbose --reporter=json --outputFile=vitest-process.json
        working-directory: packages/senpi-codemode

      # Runs whatever the suite's outcome: a failed run is when a kernel child is most likely to leak.

      - name: Fail on any orphaned kernel child
        if: always() && steps.process_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: |
          orphans=$(ps -eo pid,ppid,command | grep '[p]rocess-entry.js' | awk '$2 == 1' || true)
          if [ -n "$orphans" ]; then echo "$orphans"; echo "::error::kernel children outlived the suite"; exit 1; fi

      - name: Require the process-mode suite to have executed
        if: always() && steps.process_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-process.json", "utf8"));
            const results = r.testResults.flatMap((file) => file.assertionResults);
            const passed = results.filter((a) => a.status === "passed").length;
            const failed = results.filter((a) => a.status === "failed").length;
            const skipped = results.filter((a) => a.status !== "passed" && a.status !== "failed");
            // A skip is allowed only for a Linux-only case off Linux (named, so a newly skipped test still fails here).
            const linuxOnly = /When a Linux kernel child|SENPI_KERNEL_CORE_DUMPS=1|parent is a subreaper/;
            const unexpected = skipped.filter((a) => process.platform === "linux" || !linuxOnly.test(a.title));
            console.log("process-mode suite: passed=" + passed + " failed=" + failed + " skipped=" + skipped.length);
            for (const a of unexpected) console.log("unexpected skip: " + a.title);
            if (passed < 30 || failed !== 0 || unexpected.length !== 0) process.exit(1);
          '
        working-directory: packages/senpi-codemode

      - name: Check OS temp after tests
        if: always() && steps.process_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/process-test-temp-before.json

      - name: Require the POSIX exit-event compiler
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          command -v cc >/dev/null || { echo "::error::Missing C compiler 'cc' on PATH for POSIX process-exit tests"; exit 1; }
          cc --version

      - name: Snapshot OS temp before tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: rpc_test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/rpc-test-temp-before.json --export-env

      - name: Supervisor owner, normal-stop and compiler regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.rpc_test_temp_snapshot.outcome == 'success' }}
        id: rpc
        timeout-minutes: 15
        working-directory: packages/coding-agent
        run: >
          node ../../scripts/run-tests.mjs vitest run
          test/suite/regressions/3044-rpc-owner-lifetime.test.ts
          test/suite/regressions/3045-owner-review.test.ts
          test/suite/regressions/3054-supervisor-child-exit.test.ts
          test/suite/regressions/3054-process-exit-compiler.test.ts
          test/suite/regressions/3054-legacy-drain-deadline.test.ts

      - name: Check OS temp after tests
        if: always() && steps.rpc_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/rpc-test-temp-before.json

      - name: Snapshot OS temp before tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: terminal_test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/terminal-test-temp-before.json --export-env

      - name: PTY package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.terminal_test_temp_snapshot.outcome == 'success' }}
        id: terminal_pty
        timeout-minutes: 15
        run: npm run test --workspace @earendil-works/pi-pty

      - name: Terminal extension + shell resolution tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.terminal_test_temp_snapshot.outcome == 'success' }}
        id: terminal_extension
        timeout-minutes: 15
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/suite/terminal-extension.test.ts test/suite/terminal-settings-notify.test.ts test/suite/shell-config-kind.test.ts test/suite/regressions/issue-1229-win-fswatch-noncanonical-abort.test.ts
        working-directory: packages/coding-agent

      - name: Check OS temp after tests
        if: always() && steps.terminal_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/terminal-test-temp-before.json

      - name: Snapshot OS temp before tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: inspector_test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/inspector-test-temp-before.json --export-env

      - name: Run Inspector handoff regression
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.inspector_test_temp_snapshot.outcome == 'success' }}
        id: inspector
        timeout-minutes: 20
        run: node ../../scripts/run-tests.mjs vitest run test/suite/regressions/inspector-endpoint-handoff.test.ts
        working-directory: packages/coding-agent

      - name: Summarize Inspector handoff
        if: always() && steps.inspector_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Inspector handoff"
            echo "- OS: ${{ runner.os }}"
            echo "- Node: 24"
            echo "- Test: inspector-endpoint-handoff.test.ts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check OS temp after tests
        if: always() && steps.inspector_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/inspector-test-temp-before.json

      - name: Snapshot OS temp before tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: webview_test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/webview-test-temp-before.json --export-env

      - name: Run eval kernel WebView suites (Bun)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.webview_test_temp_snapshot.outcome == 'success' }}
        id: webview
        timeout-minutes: 12
        shell: bash
        env:
          SENPI_WEBVIEW_READINESS_LOG: ${{ runner.temp }}/webview-readiness.log
        run: |
          out="$RUNNER_TEMP/vitest-webview.txt"
          bun ../../scripts/run-tests.mjs vitest run test/js-kernel-webview.test.ts test/js-kernel-webview-lifecycle.test.ts test/js-kernel-webview-resilience.test.ts test/js-kernel-webview-launch.test.ts test/js-kernel-webview-readiness.test.ts --reporter=verbose --reporter=hanging-process --reporter=json --outputFile=vitest-webview.json > "$out" 2>&1 &
          suite=$!
          for _ in $(seq 1 540); do kill -0 "$suite" 2>/dev/null || break; sleep 1; done
          if kill -0 "$suite" 2>/dev/null; then
            cat "$out"
            echo "::error::WebView suites still running after 9 minutes; the last finished test is above"
            if command -v tasklist >/dev/null; then tasklist //FO CSV | grep -iE 'chrome|bun|node|powershell|tasklist|taskkill' || true; else ps -axo pid,ppid,etime,command | grep -iE 'chrom|bun|node' || true; fi
            cat "$SENPI_WEBVIEW_READINESS_LOG" 2>/dev/null || true
            kill "$suite" 2>/dev/null || true
            exit 1
          fi
          status=0
          wait "$suite" || status=$?
          cat "$out"
          exit "$status"
        working-directory: packages/senpi-codemode

      # senpi#2353: one line per Chrome launch (time to attach, or the stalled phase and the retirement).

      - name: Show the WebView readiness log
        if: always() && steps.webview_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: cat "$RUNNER_TEMP/webview-readiness.log" 2>/dev/null || echo "no readiness log"

      - name: Require the WebView suites to have executed
        if: ${{ !cancelled() && steps.webview.outcome == 'success' }}
        shell: bash
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("vitest-webview.json", "utf8"));
            const results = r.testResults.flatMap((file) => file.assertionResults);
            const passed = results.filter((a) => a.status === "passed").length;
            const failed = results.filter((a) => a.status === "failed").length;
            const skipped = results.filter((a) => a.status !== "passed" && a.status !== "failed").length;
            const allowedSkips = process.platform === "win32" ? 1 : 0;
            console.log("webview suites: passed=" + passed + " failed=" + failed + " skipped=" + skipped);
            if (passed < 10 || failed !== 0 || skipped > allowedSkips) process.exit(1);
          '
        working-directory: packages/senpi-codemode

      - name: Check OS temp after tests
        if: always() && steps.webview_test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/webview-test-temp-before.json


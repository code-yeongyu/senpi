name: npm audit

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production vulnerabilities (reviewed exceptions only)
        # Fails on any moderate-or-above finding unless every advisory behind it is in
        # .github/npm-audit-exceptions.json; an expired, over-long or unmatched exception fails too.
        run: node scripts/npm-audit-gate.mjs .github/npm-audit-exceptions.json

      - name: Verify registry signatures
        run: npm audit signatures --omit=dev

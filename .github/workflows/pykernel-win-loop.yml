name: Python kernel Windows loop (temporary, senpi#2980)

# Temporary probe for senpi#2980 / senpi#3600: loops the Python kernel start inside one windows-latest job.
# Runs only for fix/2980-* branches; removed before the fix merges.
on:
  push:
    branches: ["fix/2980-**"]

concurrency:
  group: pykernel-win-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loop:
    name: Python kernel start loop (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Probe loop
        working-directory: packages/senpi-codemode
        run: bun scripts/qa-py-kernel-win-loop.ts

name: Windows archive tool proof (temporary, senpi#7473)

# Temporary: runs the Compiled extensions (Windows) job exactly as ci.yml defines it on this PR's branch
# (the PR CI runs Linux only). Removed before the fix merges.
on:
  push:
    branches: ["fix/win-archive-tool-**"]

concurrency:
  group: win-archive-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SENPI_TEST_TEMP_GUARD: "1"
  CODING_AGENT_BUN_VERSION: "1.4.4"

jobs:
  compiled-extensions-windows:
    name: Compiled extensions (Windows)
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # No archive tool install: scripts/build-binaries.sh writes the Windows zip with the bsdtar Windows ships (senpi#7473).
      - name: Show the archiver build-binaries.sh will use (proof only)
        shell: bash
        run: |
          if command -v zip; then echo "zip IS on PATH: this run would not exercise the bsdtar path"; exit 1; fi
          echo "no zip on PATH; build-binaries.sh uses $SYSTEMROOT/System32/tar.exe"
          "$SYSTEMROOT/System32/tar.exe" --version
          command -v unzip
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace package entries
        run: npm run build

      - name: Snapshot OS temp before tests
        id: test_temp_snapshot
        shell: bash
        run: node scripts/test-temp-guard.mjs snapshot local-ignore/test-temp-before.json --export-env

      - name: Verify native importer
        shell: bash
        run: node ../../scripts/run-tests.mjs vitest run test/extensions/bun-extension-importer.test.ts test/extensions/bun-extension-regressions.test.ts
        working-directory: packages/coding-agent

      - name: Verify relocated compiled extensions
        shell: bash
        run: node scripts/run-tests.mjs bun test scripts/compiled-extension-platform.test.ts scripts/compiled-extension-load.test.ts
      - name: Check OS temp after tests
        if: always() && steps.test_temp_snapshot.outcome == 'success'
        shell: bash
        run: node scripts/test-temp-guard.mjs check local-ignore/test-temp-before.json

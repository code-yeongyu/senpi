name: Path resolution regression

on:
  pull_request:
    paths:
      - "packages/machine-ops/src/policy/filesystem.ts"
      - "packages/machine-ops/src/errors.ts"
      - "packages/coding-agent/src/core/extensions/builtin/moved-path-guard/resolve-async.ts"
      - "packages/machine-ops/test/filesystem-resolution.test.ts"
      - "packages/coding-agent/test/suite/moved-path-guard-cancellation.test.ts"
      - "scripts/qa/path-resolution-smoke.ts"
      - ".github/workflows/path-resolution-regression.yml"
  push:
    paths:
      - "packages/machine-ops/**"
      - "packages/coding-agent/src/core/extensions/builtin/moved-path-guard/**"
      - "packages/coding-agent/test/suite/moved-path-guard-*.test.ts"
      - "scripts/qa/path-resolution-smoke.ts"
      - ".github/workflows/path-resolution-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:scripts

  regression:
    name: Paths on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: npm ci --ignore-scripts
      - name: Filesystem regression and coverage
        working-directory: packages/machine-ops
        run: node ../../node_modules/vitest/vitest.mjs run test/filesystem-resolution.test.ts test/operation-errors.test.ts --coverage --coverage.include=src/policy/filesystem.ts --coverage.include=src/errors.ts --coverage.reporter=text --coverage.reporter=json-summary --coverage.thresholds.lines=95 --coverage.thresholds.statements=95 --coverage.thresholds.functions=95 --coverage.thresholds.branches=95 --coverage.thresholds.perFile=true
      - name: Cancelled write has no effect
        working-directory: packages/machine-ops
        run: node ../../node_modules/vitest/vitest.mjs run test/local-conformance.test.ts -t "cancelled request"
      - name: Guard cancellation regression
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/vitest.mjs run test/suite/moved-path-guard-cancellation.test.ts test/suite/moved-path-guard-step-timeouts.test.ts test/suite/moved-path-guard-trust.test.ts test/suite/moved-path-guard-reused.test.ts --coverage --coverage.include=src/core/extensions/builtin/moved-path-guard/resolve-async.ts --coverage.reporter=text --coverage.reporter=json-summary --coverage.thresholds.lines=95 --coverage.thresholds.statements=95 --coverage.thresholds.functions=95 --coverage.thresholds.branches=95
      - name: Node filesystem integration
        run: node scripts/qa/path-resolution-smoke.ts
      - name: Bun filesystem integration
        run: bun scripts/qa/path-resolution-smoke.ts
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: path-resolution-${{ matrix.os }}
          path: |
            packages/machine-ops/coverage
            packages/coding-agent/coverage

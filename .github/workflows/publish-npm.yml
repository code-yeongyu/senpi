name: Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit CalVer (e.g. 2026.05.13-2). Empty = auto-compute today.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry-run preview only (no publish or push)'
        required: false
        type: boolean
        default: false
      publish-only:
        description: 'Publish an already prepared version through GitHub OIDC; requires version.'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  native-prebuilds:
    if: ${{ inputs.publish-only == true }}
    uses: ./.github/workflows/native-prebuilds.yml

  release:
    needs: native-prebuilds
    if: ${{ always() && (inputs.publish-only != true || needs.native-prebuilds.result == 'success') }}
    runs-on: ubuntu-latest
    # The release never re-runs the test suite (senpi#2943): its test evidence is the release
    # commit's green sharded CI run ("Check and test"). A regenerated catalog is pushed to main
    # first and CI tests it there. The job waits up to 40 min for that CI result (CI walls
    # measured at 7-22 min), plus about 10 min of install, build and push, so 60 min clears it.
    # A release whose HEAD already has green CI finishes in a few minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "YeonGyu-Kim"
          git config --global user.email "code.yeon.gyu@gmail.com"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Assert bun 1.4 toolchain
        run: bash scripts/assert-bun-toolchain.sh

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download native prebuilds
        if: inputs.publish-only == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-prebuild-*
          path: packages/pty/.native-prebuild-artifacts
          merge-multiple: true

      # The merged download root is untracked scratch. Copy every target's PTY prebuild
      # into the loader tree explicitly (native/prebuilds/<target>/senpi_pty.<target>.node)
      # so the pack check below fails on a missing addon instead of packing the scratch
      # root, which holds the grep addon and manifest files as well.
      - name: Stage PTY prebuilds into the pty package
        if: inputs.publish-only == true
        run: |
          set -euo pipefail
          artifacts="packages/pty/.native-prebuild-artifacts"
          for prebuild in "${artifacts}"/native/prebuilds/*/senpi_pty.*.node; do
            test -f "${prebuild}" || continue
            target="$(basename "$(dirname "${prebuild}")")"
            mkdir -p "packages/pty/native/prebuilds/${target}"
            cp "${prebuild}" "packages/pty/native/prebuilds/${target}/senpi_pty.${target}.node"
          done

      # coding-agent tool tests resolve rg/fd via system binaries first and only
      # download from GitHub releases as a fallback. Unauthenticated downloads
      # are rate-limited on shared runner egress IPs, which flakes the release
      # gate; provisioning the binaries here keeps the fallback unused.
      - name: Provision ripgrep and fd
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find

      - name: Build all workspaces (so husky pre-commit type check resolves)
        run: npm run build

      - name: Reset auto-generated and npm-install drift files (not part of release diff)
        run: git checkout -- packages/ai/src/models.generated.ts package-lock.json

      - name: Run release
        if: inputs.publish-only != true
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_AUTOMATION_TOKEN }}
          SENPI_SKIP_PM_VERIFY: '1'
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::UPSTREAM_AUTOMATION_TOKEN is required to push release commits and tags through branch protection."
            exit 1
          }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ARGS=()
          if [ -n "${{ inputs.version }}" ]; then
            ARGS+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          npm run release -- "${ARGS[@]}"

      - name: Publish prepared version
        if: inputs.publish-only == true
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test -n "$EXPECTED_VERSION" || {
            echo "publish-only requires an explicit version" >&2
            exit 1
          }
          ACTUAL_VERSION="$(node -p 'require("./packages/coding-agent/package.json").version')"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || {
            echo "expected $EXPECTED_VERSION, found $ACTUAL_VERSION" >&2
            exit 1
          }
          PUBLISH_ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH_ARGS+=(--dry-run)
          fi
          node scripts/publish.mjs "${PUBLISH_ARGS[@]}" \
            --require-native-prebuilds=darwin-arm64,darwin-x64,linux-x64,linux-arm64,win32-x64

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Mode | ${{ inputs.publish-only && 'publish-only' || 'release' }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo "| Version | ${{ inputs.version || 'auto' }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

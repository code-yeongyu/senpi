name: Native Prebuilds

on:
  workflow_call:
    inputs:
      native_package_dir:
        required: false
        type: string
        default: crates/senpi-pty
      ref:
        description: 'Git ref to build (publish-only passes refs/tags/v<version>); empty builds the triggering commit'
        required: false
        type: string
        default: ''
    outputs:
      ready:
        description: "'true' when every target's prebuild was reused or built in this run (see job ready)"
        value: ${{ jobs.ready.outputs.ready }}
  workflow_dispatch:
    inputs:
      native_package_dir:
        description: 'Directory containing the native package Cargo.toml and package.json'
        required: false
        type: string
        default: crates/senpi-pty
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-prebuilds.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/senpi-pty/**'
      - 'crates/senpi-grep/**'
      - 'crates/senpi-socket-secret/**'
      - 'packages/pty/**'
      - 'packages/coding-agent/native/**'
      - 'scripts/probe-native-grep*.mjs'
      - 'scripts/probe-native-pty-lifecycle.mjs'
      - 'scripts/native-prebuild-*'
      - 'rust-toolchain.toml'
      - 'scripts/ci/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-prebuilds.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/senpi-pty/**'
      - 'crates/senpi-grep/**'
      - 'crates/senpi-socket-secret/**'
      - 'packages/pty/**'
      - 'packages/coding-agent/native/**'
      - 'scripts/probe-native-grep*.mjs'
      - 'scripts/probe-native-pty-lifecycle.mjs'
      - 'scripts/native-prebuild-*'
      - 'rust-toolchain.toml'
      - 'scripts/ci/**'

permissions:
  contents: read

concurrency:
  group: native-prebuilds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_ZIGBUILD_VERSION: 0.23.0
  NAPI_CLI_VERSION: 3.7.2
  NODE_VERSION: '24'
  ZIG_VERSION: 0.14.1

jobs:
  # senpi#6622: each target's prebuild is keyed by every input that shapes it
  # (scripts/native-prebuild-key.mjs). This ubuntu job restores the targets whose key already has a
  # prebuild in the Actions cache, verifies each file's sha256 against the record the build job wrote,
  # and re-uploads it under the artifact name the build job would have used. Only the remaining
  # targets reach the build matrix, so a release whose inputs main already built starts no macOS job.
  # The cache is scoped by GitHub per branch: a run reads its own ref's entries and the default
  # branch's, so a pull request (including a fork) can never write an entry a release on main reads.
  plan:
    name: Plan native prebuilds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
      rustc: ${{ steps.keys.outputs.rustc }}
      reused: ${{ steps.select.outputs.reused }}
      matrix: ${{ steps.select.outputs.matrix }}
      missing: ${{ steps.select.outputs.missing }}
      missing_count: ${{ steps.select.outputs.missing_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # The same toolchain resolution the build rows run; rust-toolchain.toml selects the channel.
      - name: Resolve Rust toolchain
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          {
            echo "RUSTC_VV<<RUSTC_VV_EOF"
            rustc -vV
            echo "RUSTC_VV_EOF"
          } >> "${GITHUB_ENV}"

      - name: Compute reuse keys
        id: keys
        run: node scripts/native-prebuild-reuse.mjs keys

      - name: Restore native-prebuild-win32-x64
        id: restore_win32_x64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-win32-x64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-win32-x64'] }}

      - name: Restore native-prebuild-win32-arm64
        id: restore_win32_arm64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-win32-arm64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-win32-arm64'] }}

      - name: Restore native-prebuild-darwin-x64
        id: restore_darwin_x64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-darwin-x64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-darwin-x64'] }}

      - name: Restore native-prebuild-darwin-arm64
        id: restore_darwin_arm64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-darwin-arm64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-darwin-arm64'] }}

      - name: Restore native-prebuild-linux-x64
        id: restore_linux_x64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-linux-x64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-linux-x64'] }}

      - name: Restore native-prebuild-linux-arm64
        id: restore_linux_arm64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-linux-arm64
          key: ${{ fromJSON(steps.keys.outputs.keys)['native-prebuild-linux-arm64'] }}

      - name: Select targets to reuse or build
        id: select
        env:
          KEYS: ${{ steps.keys.outputs.keys }}
          RUSTC: ${{ steps.keys.outputs.rustc }}
          # actions/cache can match the primary key as a prefix; only an entry stored under exactly the
          # computed key is considered.
          MATCHED_KEYS: |
            {
              "native-prebuild-win32-x64": "${{ steps.restore_win32_x64.outputs.cache-matched-key }}",
              "native-prebuild-win32-arm64": "${{ steps.restore_win32_arm64.outputs.cache-matched-key }}",
              "native-prebuild-darwin-x64": "${{ steps.restore_darwin_x64.outputs.cache-matched-key }}",
              "native-prebuild-darwin-arm64": "${{ steps.restore_darwin_arm64.outputs.cache-matched-key }}",
              "native-prebuild-linux-x64": "${{ steps.restore_linux_x64.outputs.cache-matched-key }}",
              "native-prebuild-linux-arm64": "${{ steps.restore_linux_arm64.outputs.cache-matched-key }}"
            }
        run: node scripts/native-prebuild-reuse.mjs select --cache-root .native-prebuild-cache

      - name: Upload reused native-prebuild-win32-x64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-win32-x64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-win32-x64
          path: .native-prebuild-cache/native-prebuild-win32-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload reused native-prebuild-win32-arm64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-win32-arm64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-win32-arm64
          path: .native-prebuild-cache/native-prebuild-win32-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Upload reused native-prebuild-darwin-x64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-darwin-x64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-darwin-x64
          path: .native-prebuild-cache/native-prebuild-darwin-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload reused native-prebuild-darwin-arm64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-darwin-arm64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-darwin-arm64
          path: .native-prebuild-cache/native-prebuild-darwin-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Upload reused native-prebuild-linux-x64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-linux-x64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-linux-x64
          path: .native-prebuild-cache/native-prebuild-linux-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload reused native-prebuild-linux-arm64
        if: ${{ contains(fromJSON(steps.select.outputs.reused), 'native-prebuild-linux-arm64') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-prebuild-linux-arm64
          path: .native-prebuild-cache/native-prebuild-linux-arm64
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.artifact }}
    needs: plan
    if: ${{ needs.plan.outputs.missing_count != '0' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.best_effort }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Rows live in scripts/native-prebuild-targets.json; plan passes only the targets it could not
      # reuse, each with its reuse key. cross_compile gates the on-runner test/probe steps (target arch
      # != runner arch). napi_cross_compile passes --cross-compile to napi, which requires zig (or
      # cargo-xwin); darwin cross builds use Apple's native toolchain instead, so they keep
      # napi_cross_compile false.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    env:
      NATIVE_PACKAGE_DIR: ${{ inputs.native_package_dir || 'crates/senpi-pty' }}
      NAPI_TARGET: ${{ matrix.napi_target }}
      RUST_TARGET: ${{ matrix.rust_target }}
      NODE_PLATFORM: ${{ matrix.node_platform }}
      NODE_ARCH: ${{ matrix.node_arch }}
      NAPI_CROSS_COMPILE: ${{ matrix.napi_cross_compile }}
      LINUX_ROW: ${{ matrix.linux }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup Rust target
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${RUST_TARGET}"

      # One cache per target: rows sharing a runner OS would otherwise restore each other's target dir.
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ matrix.rust_target }}

      - name: Setup Zig and cargo-zigbuild
        if: ${{ matrix.linux }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl xz-utils

          case "$(uname -m)" in
            x86_64)
              zig_arch="x86_64"
              ;;
            aarch64|arm64)
              zig_arch="aarch64"
              ;;
            *)
              echo "::error::Unsupported runner architecture for Zig: $(uname -m)"
              exit 1
              ;;
          esac

          # Zig 0.14.1 renamed release tarballs from zig-<os>-<arch> to zig-<arch>-<os>.
          zig_dir="zig-${zig_arch}-linux-${ZIG_VERSION}"
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${zig_dir}.tar.xz"
          tar -xf "${zig_dir}.tar.xz"
          echo "${PWD}/${zig_dir}" >> "${GITHUB_PATH}"

          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Rust lifecycle tests
        if: ${{ !matrix.cross_compile }}
        run: |
          set -euo pipefail

          cargo test -p senpi-pty --target "${RUST_TARGET}" --locked
          cargo test -p senpi-grep --target "${RUST_TARGET}" --locked

      - name: Build native prebuild
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/native-prebuild-output"
          target_dir="${RUNNER_TEMP}/native-prebuild-target"
          # Each matrix row builds both native crates into a shared target-dir/output-dir.
          native_package_dirs=(crates/senpi-pty crates/senpi-grep)
          # The socket-secret bridge is Windows-only (sisyphuslabs/omo-desktop-app#4199).
          if [[ "${NODE_PLATFORM}" == "win32" ]]; then
            native_package_dirs+=(crates/senpi-socket-secret)
          fi

          # @napi-rs/cli 3.7.2 resolves the built artifact from
          # <target-dir>/<napi-target>/release, but cargo-zigbuild strips the glibc-version suffix
          # (e.g. ".2.17") from the target before invoking cargo, so cargo actually writes the
          # artifact to <target-dir>/<plain-triple>/release. That mismatch makes napi's post-build
          # copy fail with "Internal Error: Failed to copy artifact" even though the compile
          # succeeded (napi-rs/napi-rs#3176). Bridge the two directory names with a symlink so
          # napi's copy step resolves. Only glibc-suffixed targets contain a '.'; plain triples
          # already build into the directory napi expects.
          if [[ "${NAPI_TARGET}" == *.* ]]; then
            plain_triple="${NAPI_TARGET%%.*}"
            mkdir -p "${target_dir}"
            ln -sfn "${plain_triple}" "${target_dir}/${NAPI_TARGET}"
          fi

          for native_package_dir in "${native_package_dirs[@]}"; do
            test -f "${native_package_dir}/Cargo.toml"
            test -f "${native_package_dir}/package.json"

            args=(
              build
              --manifest-path "${native_package_dir}/Cargo.toml"
              --package-json-path "${native_package_dir}/package.json"
              --target "${NAPI_TARGET}"
              --target-dir "${target_dir}"
              --output-dir "${output_dir}"
              --release
              --strip
              --platform
            )

            if [[ "${NAPI_CROSS_COMPILE}" == "true" ]]; then
              args+=(--cross-compile)
            fi

            npm exec --yes --package "@napi-rs/cli@${NAPI_CLI_VERSION}" -- napi "${args[@]}" -- --locked
          done

      - name: Node native load and lifecycle probe
        if: ${{ !matrix.cross_compile }}
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/native-prebuild-output"
          # macOS runners ship bash 3.2, which lacks mapfile/readarray.
          node_files=()
          while IFS= read -r node_file; do
            node_files+=("${node_file}")
          done < <(find "${output_dir}" -type f -name '*.node' | sort)
          pty_file=""
          grep_file=""
          for node_file in "${node_files[@]}"; do
            case "$(basename "${node_file}")" in
              senpi_pty.*) pty_file="${node_file}" ;;
              senpi_grep.*) grep_file="${node_file}" ;;
            esac
          done
          if [[ -z "${pty_file}" || -z "${grep_file}" ]]; then
            echo "::error::expected senpi_pty.* and senpi_grep.* .node files for lifecycle probes"
            printf '%s\n' "${node_files[@]}"
            exit 1
          fi

          node scripts/probe-native-pty-lifecycle.mjs "${pty_file}"
          node scripts/probe-native-grep.mjs "${grep_file}"
          if [[ "${NODE_PLATFORM}" == "win32" ]]; then
            secret_file="$(find "${output_dir}" -type f -name 'senpi_socket_secret.*.node' | head -1)"
            test -n "${secret_file}" || { echo "::error::expected a senpi_socket_secret.*.node file"; exit 1; }
            node -e 'const b = require(process.argv[1]); if (b.__senpiSocketSecretAbi1() !== "1") throw new Error("socket-secret ABI mismatch"); console.log(JSON.stringify(b.kernelSessionIdentity()));' "${secret_file}"
          fi

      - name: Stage artifact
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/native-prebuild-artifact"
          output_dir="${RUNNER_TEMP}/native-prebuild-output"

          host="${NODE_PLATFORM}-${NODE_ARCH}"
          prebuild_dir="${artifact_dir}/native/prebuilds/${host}"

          mkdir -p "${prebuild_dir}"
          # macOS runners ship bash 3.2, which lacks mapfile/readarray.
          node_files=()
          while IFS= read -r node_file; do
            node_files+=("${node_file}")
          done < <(find "${output_dir}" -type f -name '*.node' | sort)

          expected_node_files=2
          if [[ "${NODE_PLATFORM}" == "win32" ]]; then expected_node_files=3; fi
          if [[ "${#node_files[@]}" -ne "${expected_node_files}" ]]; then
            echo "::error::expected ${expected_node_files} .node files for ${NAPI_TARGET}, found ${#node_files[@]}"
            printf '%s\n' "${node_files[@]}"
            exit 1
          fi

          # Select each addon by name: the sorted node_files list puts senpi_grep.*
          # first, so index-based copies would mislabel the grep addon as PTY.
          pty_file=""
          grep_file=""
          for node_file in "${node_files[@]}"; do
            case "$(basename "${node_file}")" in
              senpi_pty.*) pty_file="${node_file}" ;;
              senpi_grep.*) grep_file="${node_file}" ;;
            esac
          done
          if [[ -z "${pty_file}" || -z "${grep_file}" ]]; then
            echo "::error::expected senpi_pty.* and senpi_grep.* .node files for ${NAPI_TARGET}"
            printf '%s\n' "${node_files[@]}"
            exit 1
          fi

          # The PTY addon lands at the loader-relative path the publish-only job stages
          # straight into packages/pty; the grep addon stays flat for its own consumers.
          cp "${pty_file}" "${prebuild_dir}/senpi_pty.${host}.node"
          cp "${grep_file}" "${artifact_dir}/"
          secret_line=""
          if [[ "${NODE_PLATFORM}" == "win32" ]]; then
            secret_file=""
            for node_file in "${node_files[@]}"; do
              case "$(basename "${node_file}")" in senpi_socket_secret.*) secret_file="${node_file}" ;; esac
            done
            test -n "${secret_file}" || { echo "::error::expected senpi_socket_secret.*.node for ${NAPI_TARGET}"; exit 1; }
            secret_dir="${artifact_dir}/native/socket-secret/prebuilds/${host}"
            mkdir -p "${secret_dir}"
            cp "${secret_file}" "${secret_dir}/senpi_socket_secret.${host}.node"
            secret_line="file_senpi_socket_secret=$(basename "${secret_file}")"
          fi
          {
            echo "artifact=${{ matrix.artifact }}"
            echo "napi_target=${NAPI_TARGET}"
            echo "rust_target=${RUST_TARGET}"
            echo "node_platform=${NODE_PLATFORM}"
            echo "node_arch=${NODE_ARCH}"
            echo "file_senpi_pty=$(basename "${pty_file}")"
            echo "file_senpi_grep=$(basename "${grep_file}")"
            if [[ -n "${secret_line}" ]]; then echo "${secret_line}"; fi
          } > "${artifact_dir}/manifest.txt"

      # Written only after the lifecycle tests and the probe passed (earlier steps), so a reused
      # prebuild carries the evidence that its build ran them.
      - name: Record prebuild digest
        env:
          TARGET_ARTIFACT: ${{ matrix.artifact }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail

          export RUSTC_VV="$(rustc -vV)"
          node scripts/native-prebuild-reuse.mjs record --artifact-dir "${RUNNER_TEMP}/native-prebuild-artifact"

      - name: Upload native prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/native-prebuild-artifact
          if-no-files-found: error
          retention-days: 14

  # Saves each freshly built target under the key plan computed, after checking its record against
  # that key and plan's rustc; a build that resolved another rustc is left unsaved.
  save:
    name: Save native prebuilds
    needs: [plan, build]
    # Runs after a partly failed build too, so the rows that did build are saved; a target that was
    # not built has no artifact and is skipped.
    if: ${{ !cancelled() && needs.plan.outputs.missing_count != '0' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download built prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-prebuild-*
          path: .native-prebuild-download

      - name: Verify built prebuilds
        id: collect
        env:
          KEYS: ${{ needs.plan.outputs.keys }}
          RUSTC: ${{ needs.plan.outputs.rustc }}
          MISSING: ${{ needs.plan.outputs.missing }}
        run: node scripts/native-prebuild-reuse.mjs collect --download-root .native-prebuild-download --cache-root .native-prebuild-cache

      - name: Save native-prebuild-win32-x64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-win32-x64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-win32-x64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-win32-x64'] }}

      - name: Save native-prebuild-win32-arm64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-win32-arm64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-win32-arm64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-win32-arm64'] }}

      - name: Save native-prebuild-darwin-x64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-darwin-x64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-darwin-x64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-darwin-x64'] }}

      - name: Save native-prebuild-darwin-arm64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-darwin-arm64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-darwin-arm64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-darwin-arm64'] }}

      - name: Save native-prebuild-linux-x64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-linux-x64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-linux-x64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-linux-x64'] }}

      - name: Save native-prebuild-linux-arm64
        if: ${{ contains(fromJSON(steps.collect.outputs.save), 'native-prebuild-linux-arm64') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-prebuild-cache/native-prebuild-linux-arm64
          key: ${{ fromJSON(needs.plan.outputs.keys)['native-prebuild-linux-arm64'] }}

  # A caller cannot read this workflow's result from needs.<job>.result: when every target is reused,
  # build and save are skipped, and a skipped job inside a called workflow can surface to the caller as
  # a non-success result. This job always runs and states the outcome as an output instead.
  ready:
    name: Native prebuilds ready
    needs: [plan, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.result.outputs.ready }}
    steps:
      - name: Check plan and build results
        id: result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MISSING_COUNT: ${{ needs.plan.outputs.missing_count }}
        run: |
          set -euo pipefail

          echo "plan=${PLAN_RESULT} build=${BUILD_RESULT} missing_count=${MISSING_COUNT}"
          test "${PLAN_RESULT}" = success || { echo "::error::plan did not succeed"; exit 1; }
          if [[ "${MISSING_COUNT}" == "0" ]]; then
            test "${BUILD_RESULT}" = skipped || { echo "::error::build ran although every target was reused"; exit 1; }
          else
            test "${BUILD_RESULT}" = success || { echo "::error::build did not succeed"; exit 1; }
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"
